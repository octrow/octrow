<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Peterson</title>
  <desc id="desc">Python backend developer. Builds voice-AI collections calling for banks in Kazakhstan, Uzbekistan and Kyrgyzstan; the platform handles 4M+ calls a month. Measured: TTS batch 427 s to 5 s; dispatcher dialed about 3 of 50 calls per minute before a rebuild; one 918 MB Redis stream cut to thin queue records.</desc>
  <rect width="1200" height="400" rx="24" fill="#f6f5f1"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#16181d">
    <text x="56" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6b6f76" letter-spacing="2">PYTHON BACKEND · VOICE AI</text>
    <text x="52" y="170" font-size="72" font-weight="700" letter-spacing="-2">Daniel Peterson</text>
    <text x="56" y="228" font-size="28">Backends for voice-AI collections</text>
    <text x="56" y="266" font-size="28">calls at banks in KZ, UZ and KG.</text>
    <text x="56" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6b6f76">4M+ calls a month on the platform</text>
    <text x="56" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6b6f76">FastAPI · Redis Streams · RabbitMQ · LLM</text>
  </g>

  <g id="measured" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="680" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6b6f76">measured in my PRs</text>

    <line x1="680" y1="116" x2="1144" y2="116" stroke="#d9d7d0" stroke-width="1.5"/>
    <text x="680" y="170" font-size="40" font-weight="700" fill="#1f7a4d">427s → 5s</text>
    <text x="924" y="152" font-size="20" fill="#16181d">TTS batch</text>
    <text x="924" y="178" font-size="18" fill="#6b6f76">cached, run in parallel</text>

    <line x1="680" y1="200" x2="1144" y2="200" stroke="#d9d7d0" stroke-width="1.5"/>
    <text x="680" y="254" font-size="40" font-weight="700" fill="#b3261e">~3 of 50</text>
    <text x="924" y="236" font-size="20" fill="#16181d">calls/min dialed</text>
    <text x="924" y="262" font-size="18" fill="#6b6f76">rebuilt per campaign</text>

    <line x1="680" y1="284" x2="1144" y2="284" stroke="#d9d7d0" stroke-width="1.5"/>
    <text x="680" y="338" font-size="40" font-weight="700" fill="#16181d">918 MB</text>
    <text x="924" y="320" font-size="20" fill="#16181d">one Redis stream</text>
    <text x="924" y="346" font-size="18" fill="#6b6f76">cut to thin queue records</text>
  </g>
</svg>
