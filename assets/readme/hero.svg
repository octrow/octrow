<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Peterson - Python backend for voice AI</title>
  <desc id="desc">A call waveform turns into Redis Stream records; the platform handles over 4 million calls a month for banks.</desc>

  <rect width="1200" height="380" rx="20" fill="#0E1116"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#7D8590">Python backend · Voice AI</text>
    <text x="54" y="160" font-size="68" font-weight="700" fill="#E6EDF3">Daniel Peterson</text>
    <text x="56" y="214" font-size="30" fill="#E6EDF3">Voice-AI telephony backends</text>
    <text x="56" y="252" font-size="30" fill="#E6EDF3">for <tspan fill="#3FB950">collections in banking</tspan></text>
    <text x="56" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#7D8590">FastAPI · Redis Streams · RabbitMQ · LLM · K8s</text>
  </g>

  <g id="proof" transform="translate(640 60)">
    <!-- waveform: one call, bars thinning as audio becomes data -->
    <g fill="#3FB950">
      <rect x="0"   y="34" width="6" height="32" rx="3"/>
      <rect x="14"  y="18" width="6" height="64" rx="3"/>
      <rect x="28"  y="4"  width="6" height="92" rx="3"/>
      <rect x="42"  y="22" width="6" height="56" rx="3"/>
      <rect x="56"  y="10" width="6" height="80" rx="3"/>
      <rect x="70"  y="30" width="6" height="40" rx="3"/>
      <rect x="84"  y="16" width="6" height="68" rx="3"/>
      <rect x="98"  y="36" width="6" height="28" rx="3" opacity="0.7"/>
      <rect x="112" y="42" width="6" height="16" rx="3" opacity="0.5"/>
      <rect x="126" y="46" width="6" height="8"  rx="3" opacity="0.35"/>
    </g>
    <path d="M146 50 H186" stroke="#7D8590" stroke-width="1.5"/>
    <path d="M180 44 L188 50 L180 56" fill="none" stroke="#7D8590" stroke-width="1.5"/>

    <!-- stream records -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
      <text x="200" y="18" fill="#7D8590">XADD calls *</text>
      <text x="200" y="52" fill="#E6EDF3"><tspan fill="#7D8590">…-0 </tspan>queued</text>
      <text x="200" y="84" fill="#E6EDF3"><tspan fill="#7D8590">…-1 </tspan>dialing</text>
      <text x="200" y="116" fill="#E6EDF3"><tspan fill="#7D8590">…-2 </tspan>llm_turn</text>
      <text x="200" y="148" fill="#E6EDF3"><tspan fill="#7D8590">…-3 </tspan>post_call</text>
    </g>

    <rect x="0" y="186" width="504" height="1.5" fill="#30363D"/>
    <text x="0" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#3FB950">4M+</text>
    <text x="118" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#E6EDF3">calls a month on the platform</text>
    <text x="118" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#7D8590">banks in KZ · UZ · KG</text>
  </g>
</svg>
